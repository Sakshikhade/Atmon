<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Action Detector</title>
<style>
  :root {
    --bg: #f2f2f7;
    --bg-elevated: rgba(255, 255, 255, 0.78);
    --surface: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #636366;
    --separator: rgba(60, 60, 67, 0.12);
    --fill: #e5e5ea;
    --fill-input: #f2f2f7;
    --accent: #007aff;
    --accent-press: #0066d6;
    --ok: #34c759;
    --ok-bg: rgba(52, 199, 89, 0.14);
    --warn: #ff9500;
    --warn-bg: rgba(255, 149, 0, 0.14);
    --danger: #ff3b30;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
    --shadow-stage: 0 2px 4px rgba(0, 0, 0, 0.04), 0 14px 36px rgba(0, 0, 0, 0.07);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font: 100%/1.45 var(--font);
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--separator);
  }
  .topbar-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 1.15rem;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--text);
  }
  .meta {
    font-size: 0.8rem;
    color: var(--text-secondary);
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem 1rem;
    align-items: center;
  }
  .meta b { color: var(--text); font-weight: 600; }
  .mode-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .dot {
    width: 0.45rem;
    height: 0.45rem;
    border-radius: 50%;
    background: var(--text-secondary);
    flex-shrink: 0;
  }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.busy { background: var(--accent); }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 1.15rem 1.25rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .panel {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel.stage { box-shadow: var(--shadow-stage); }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 1rem 1.15rem 0.65rem;
  }
  .panel-head h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: 1.2;
  }
  .panel.stage .panel-head h2 {
    font-size: 1.2rem;
    letter-spacing: -0.02em;
  }
  .hint {
    margin: 0.25rem 0 0;
    font-size: 0.84rem;
    color: var(--text-secondary);
    line-height: 1.4;
  }
  .head-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
  }
  .panel-body { padding: 0.35rem 1.15rem 1.15rem; }

  .stage-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.85rem;
  }
  @media (min-width: 820px) {
    .stage-grid {
      grid-template-columns: minmax(0, 1.35fr) minmax(240px, 0.85fr);
      align-items: start;
    }
  }
  .stage-camera, .stage-side {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    min-height: 0;
  }

  .support-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  @media (min-width: 820px) {
    .support-grid {
      grid-template-columns: 1fr 1fr;
      align-items: start;
    }
  }

  .classes { display: flex; flex-direction: column; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--separator);
  }
  .row:last-child { border-bottom: none; }
  .row-name { font-weight: 550; letter-spacing: -0.01em; }
  .row-sub { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.1rem; }

  .tag {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.22rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .ready { background: var(--ok-bg); color: #1b7a35; }
  .notready { background: var(--warn-bg); color: #9a5b00; }

  .divider {
    height: 1px;
    background: var(--separator);
    margin: 0.85rem 0;
  }
  .subhead {
    margin: 0 0 0.55rem;
    font-size: 0.72rem;
    font-weight: 650;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .controls {
    display: flex;
    gap: 0.55rem;
    align-items: center;
    flex-wrap: wrap;
  }

  input[type=text], input[type=number], select {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
    background: var(--fill-input);
    color: var(--text);
    min-height: 2.4rem;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus {
    outline: none;
    border-color: rgba(0, 122, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.16);
  }
  #classNameInput, #classSelect { min-width: 11rem; flex: 1; }
  .cam { width: 4.2rem; }

  button, .file-btn {
    font: inherit;
    font-size: 0.88rem;
    font-weight: 560;
    padding: 0.55rem 0.95rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: var(--fill);
    color: var(--text);
    cursor: pointer;
    min-height: 2.4rem;
    transition: transform 100ms ease-out, opacity 120ms ease, background 120ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:active:not(:disabled), .file-btn:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent-press); }
  button.danger { background: var(--danger); color: #fff; }
  button.ghost, .file-btn {
    background: transparent;
    border-color: var(--separator);
  }
  button.ghost:hover:not(:disabled), .file-btn:hover { background: rgba(0, 0, 0, 0.04); }
  .file-btn { display: inline-flex; align-items: center; }
  .file-btn input { display: none; }
  .head-actions button, .head-actions .file-btn {
    min-height: 2.1rem;
    padding: 0.4rem 0.75rem;
    font-size: 0.82rem;
  }

  .preview {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: var(--radius-sm);
    background: #111;
    display: none;
  }
  .preview.record { max-width: 420px; }
  .preview-slot {
    position: relative;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #0b0b0d;
    aspect-ratio: 4 / 3;
  }
  .preview-slot .preview {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
  .preview-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    color: rgba(255, 255, 255, 0.45);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  .preview-slot.is-live .preview-placeholder { display: none; }

  .status {
    font-size: 0.86rem;
    color: var(--text-secondary);
    min-height: 1.35em;
  }
  .status.err { color: var(--danger); }
  .status.ok { color: #1b7a35; }

  .feed {
    flex: 1;
    min-height: 180px;
    max-height: 320px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 0.78rem;
    border: 1px solid var(--separator);
    border-radius: var(--radius-sm);
    padding: 0.5rem 0.7rem;
    background: var(--fill-input);
  }
  .feed div {
    padding: 0.28rem 0;
    border-bottom: 1px dashed var(--separator);
    color: var(--text-secondary);
  }
  .feed div:last-child { border-bottom: none; }
  .feed .ev-open { color: #1b7a35; }
  .feed .ev-close { color: var(--text); }
  .feed .ev-class { font-weight: 650; color: var(--text); }

  .gallery-class { margin-bottom: 1.1rem; }
  .gallery-class:last-child { margin-bottom: 0; }
  .gallery-class h3 {
    font-size: 0.92rem;
    font-weight: 620;
    margin: 0 0 0.55rem;
    letter-spacing: -0.01em;
  }
  .pill {
    display: inline-block;
    margin-left: 0.35rem;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .clips { display: flex; flex-wrap: wrap; gap: 0.85rem; }
  .clip-card {
    width: 100%;
    max-width: 200px;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .clip-card video {
    width: 100%;
    border-radius: var(--radius-sm);
    background: #000;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }
  .clip-meta {
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.35;
  }
  .clip-actions { display: flex; gap: 0.35rem; }
  .clip-actions button {
    min-height: 1.9rem;
    padding: 0.3rem 0.55rem;
    font-size: 0.75rem;
  }

  .empty {
    color: var(--text-secondary);
    font-size: 0.88rem;
    margin: 0.2rem 0;
  }

  @media (prefers-reduced-transparency: reduce) {
    .topbar {
      background: #f2f2f7;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    button, .file-btn { transition: none; }
    button:active:not(:disabled), .file-btn:active { transform: none; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Action Detector</div>
      <div class="meta">
        <span class="mode-pill"><span id="modeDot" class="dot"></span>Mode <b id="mode">…</b></span>
        <span>Backbone <b id="backbone">…</b></span>
        <span>τ <b id="tau">…</b></span>
      </div>
    </div>
  </header>

  <main>
    <section class="panel stage" aria-labelledby="live-title">
      <div class="panel-head">
        <div>
          <h2 id="live-title">Live</h2>
          <p class="hint">Detect against the webcam. Needs a built reference bank.</p>
        </div>
        <div class="head-actions">
          <input id="cameraIndexLive" class="cam" type="number" value="0" title="Camera index" aria-label="Live camera index" />
          <button id="liveStartBtn" class="primary" type="button">Start</button>
          <button id="liveStopBtn" class="danger" type="button" disabled>Stop</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="stage-grid">
          <div class="stage-camera">
            <div class="preview-slot" id="livePreviewSlot">
              <div class="preview-placeholder">Press Start to open the camera</div>
              <img id="livePreview" class="preview live" alt="Live preview" />
            </div>
            <div id="liveStatus" class="status"></div>
          </div>
          <div class="stage-side">
            <p class="subhead">Event feed</p>
            <div id="liveFeed" class="feed" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="support-grid">
      <section class="panel" aria-labelledby="refs-title">
        <div class="panel-head">
          <div>
            <h2 id="refs-title">References</h2>
            <p class="hint">Teach a class with a clean 2-4s clip.</p>
          </div>
          <div class="head-actions">
            <button id="rebuildBtn" class="ghost" type="button" title="Rebuild prototype bank">Rebuild</button>
          </div>
        </div>
        <div class="panel-body">
          <p class="subhead">Classes</p>
          <div id="classes" class="classes"></div>

          <div class="divider" role="presentation"></div>

          <p class="subhead">Add reference</p>
          <div class="controls" style="margin-bottom: 0.65rem;">
            <select id="classSelect" aria-label="Use case">
              <option value="">Select use case…</option>
              <option value="__new__">New use case…</option>
            </select>
            <input id="classNameInput" type="text" placeholder="new_name" style="display:none" autocomplete="off" />
            <input id="cameraIndexRef" class="cam" type="number" value="0" title="Camera index" aria-label="Record camera index" />
          </div>
          <div class="controls" style="margin-bottom: 0.65rem;">
            <button id="recordStartBtn" class="primary" type="button">Record</button>
            <button id="recordStopBtn" type="button" disabled>Stop &amp; save</button>
            <button id="recordCancelBtn" class="ghost" type="button" disabled>Cancel</button>
            <label class="file-btn">Upload<input id="uploadInput" type="file" accept="video/*" /></label>
          </div>
          <img id="recordPreview" class="preview record" alt="Recording preview" />
          <div id="recordStatus" class="status"></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="gallery-title">
        <div class="panel-head">
          <div>
            <h2 id="gallery-title">Captures</h2>
            <p class="hint">Clips saved from live detections.</p>
          </div>
          <div class="head-actions">
            <button id="refreshGalleryBtn" class="ghost" type="button">Refresh</button>
            <button id="deleteAllBtn" class="ghost" type="button">Delete all</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="gallery"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    let currentMode = 'idle';
    let knownClasses = [];

    function setStatus(el, text, kind) {
      el.textContent = text || '';
      el.className = 'status' + (kind ? ' ' + kind : '');
    }

    function feedLine(text, opts) {
      const feed = document.getElementById('liveFeed');
      const row = document.createElement('div');
      if (opts && opts.kind === 'open') row.classList.add('ev-open');
      if (opts && opts.kind === 'close') row.classList.add('ev-close');
      if (opts && opts.className) {
        row.innerHTML = `<span class="ev-class">${opts.className}</span> · ${text}`;
      } else {
        row.textContent = text;
      }
      feed.prepend(row);
    }

    async function post(url) {
      const res = await fetch(url, { method: 'POST' });
      if (!res.ok) {
        let detail = res.statusText;
        try {
          const body = await res.json();
          detail = body.detail || JSON.stringify(body);
        } catch (_) {}
        throw new Error(detail);
      }
      return res.json().catch(() => ({}));
    }

    function selectedClassName() {
      const sel = document.getElementById('classSelect');
      if (sel.value === '__new__') {
        return document.getElementById('classNameInput').value.trim();
      }
      return sel.value.trim();
    }

    document.getElementById('classSelect').onchange = () => {
      const isNew = document.getElementById('classSelect').value === '__new__';
      const input = document.getElementById('classNameInput');
      input.style.display = isNew ? '' : 'none';
      if (isNew) input.focus();
    };

    function updateModeDot(mode) {
      const dot = document.getElementById('modeDot');
      dot.className = 'dot';
      if (mode === 'idle') dot.classList.add('ok');
      else if (mode === 'live' || mode === 'recording' || mode === 'detecting') dot.classList.add('busy');
      else dot.classList.add('warn');
    }

    async function refreshState() {
      const res = await fetch('/api/state');
      const s = await res.json();
      currentMode = s.mode;
      document.getElementById('mode').textContent = s.mode;
      updateModeDot(s.mode);
      document.getElementById('backbone').textContent = s.backbone || '—';
      document.getElementById('tau').textContent =
        s.tau_high === null || s.tau_high === undefined
          ? 'not set'
          : s.tau_high.toFixed(3) + (s.tau_high_source ? ' · ' + s.tau_high_source : '');

      knownClasses = s.classes || [];
      const el = document.getElementById('classes');
      el.innerHTML = '';
      if (!knownClasses.length) {
        el.innerHTML = '<p class="empty">No classes yet — record or upload below.</p>';
      }
      for (const c of knownClasses) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML =
          `<div><div class="row-name">${c.name}</div>` +
          `<div class="row-sub">${c.n_references} reference${c.n_references === 1 ? '' : 's'}</div></div>` +
          `<span class="tag ${c.ready ? 'ready' : 'notready'}">${c.ready ? 'Ready' : 'Needs rebuild'}</span>`;
        el.appendChild(row);
      }

      const sel = document.getElementById('classSelect');
      const prev = sel.value;
      sel.innerHTML = '<option value="">Select use case…</option>';
      for (const c of knownClasses) {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name;
        sel.appendChild(opt);
      }
      const neu = document.createElement('option');
      neu.value = '__new__';
      neu.textContent = 'New use case…';
      sel.appendChild(neu);
      if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
      document.getElementById('classNameInput').style.display = sel.value === '__new__' ? '' : 'none';

      const idle = s.mode === 'idle';
      document.getElementById('recordStartBtn').disabled = !idle;
      document.getElementById('rebuildBtn').disabled = !idle;
      document.getElementById('liveStartBtn').disabled = !idle || !s.bank_built;
      document.getElementById('uploadInput').disabled = !idle;
    }
    refreshState();
    setInterval(refreshState, 3000);

    let previewTimer = null;
    function stopPreview() {
      if (previewTimer) {
        clearInterval(previewTimer);
        previewTimer = null;
      }
    }
    function startPreview(imgEl) {
      imgEl.style.display = 'block';
      if (imgEl.id === 'livePreview') {
        document.getElementById('livePreviewSlot').classList.add('is-live');
      }
      stopPreview();
      previewTimer = setInterval(async () => {
        try {
          const res = await fetch('/api/preview.jpg?t=' + Date.now());
          if (!res.ok || res.status === 204) return;
          const blob = await res.blob();
          if (!blob || blob.size === 0) return;
          const url = URL.createObjectURL(blob);
          const prev = imgEl.dataset.blobUrl;
          imgEl.src = url;
          imgEl.dataset.blobUrl = url;
          if (prev) URL.revokeObjectURL(prev);
        } catch (_) {}
      }, 120);
    }
    function hidePreview(imgEl) {
      stopPreview();
      imgEl.style.display = 'none';
      if (imgEl.dataset.blobUrl) {
        URL.revokeObjectURL(imgEl.dataset.blobUrl);
        delete imgEl.dataset.blobUrl;
      }
      imgEl.removeAttribute('src');
      if (imgEl.id === 'livePreview') {
        document.getElementById('livePreviewSlot').classList.remove('is-live');
      }
    }

    const recordStatus = document.getElementById('recordStatus');
    const liveStatus = document.getElementById('liveStatus');

    document.getElementById('rebuildBtn').onclick = async () => {
      try {
        setStatus(recordStatus, 'Rebuilding prototype bank…');
        await post('/api/prototypes/rebuild');
      } catch (err) {
        setStatus(recordStatus, String(err.message || err), 'err');
      }
    };

    document.getElementById('recordStartBtn').onclick = async () => {
      const name = selectedClassName();
      if (!name) {
        setStatus(recordStatus, 'Pick or name a use case first.', 'err');
        return;
      }
      const cam = document.getElementById('cameraIndexRef').value || '0';
      try {
        if (document.getElementById('classSelect').value === '__new__') {
          await post('/api/classes?class_name=' + encodeURIComponent(name));
        }
        await post('/api/record/start?class_name=' + encodeURIComponent(name) + '&camera_index=' + encodeURIComponent(cam));
        document.getElementById('recordStartBtn').disabled = true;
        document.getElementById('recordStopBtn').disabled = false;
        document.getElementById('recordCancelBtn').disabled = false;
        startPreview(document.getElementById('recordPreview'));
        setStatus(recordStatus, 'Recording…');
      } catch (err) {
        setStatus(recordStatus, String(err.message || err), 'err');
      }
    };

    document.getElementById('recordStopBtn').onclick = async () => {
      try {
        const data = await post('/api/record/stop?save=true');
        document.getElementById('recordStopBtn').disabled = true;
        document.getElementById('recordCancelBtn').disabled = true;
        hidePreview(document.getElementById('recordPreview'));
        if (!data.saved) {
          setStatus(recordStatus, data.warning || 'Nothing saved.', 'err');
        } else if (data.warning) {
          setStatus(recordStatus, data.warning, 'err');
        } else {
          setStatus(recordStatus, 'Saved — building bank…');
        }
      } catch (err) {
        setStatus(recordStatus, String(err.message || err), 'err');
      }
    };

    document.getElementById('recordCancelBtn').onclick = async () => {
      try {
        await post('/api/record/stop?save=false');
      } catch (_) {}
      document.getElementById('recordStopBtn').disabled = true;
      document.getElementById('recordCancelBtn').disabled = true;
      hidePreview(document.getElementById('recordPreview'));
      setStatus(recordStatus, 'Cancelled.');
      refreshState();
    };

    document.getElementById('uploadInput').onchange = async (ev) => {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      const name = selectedClassName();
      if (!name) {
        setStatus(recordStatus, 'Pick or name a use case first.', 'err');
        return;
      }
      try {
        if (document.getElementById('classSelect').value === '__new__') {
          await post('/api/classes?class_name=' + encodeURIComponent(name));
        }
        const fd = new FormData();
        fd.append('file', file);
        setStatus(recordStatus, 'Uploading…');
        const res = await fetch('/api/references/upload?class_name=' + encodeURIComponent(name), {
          method: 'POST',
          body: fd,
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || res.statusText);
        }
        setStatus(recordStatus, 'Uploaded — building bank…');
      } catch (err) {
        setStatus(recordStatus, String(err.message || err), 'err');
      }
    };

    document.getElementById('liveStartBtn').onclick = async () => {
      const cam = document.getElementById('cameraIndexLive').value || '0';
      try {
        await post('/api/live/start?camera_index=' + encodeURIComponent(cam));
        document.getElementById('liveStartBtn').disabled = true;
        document.getElementById('liveStopBtn').disabled = false;
        startPreview(document.getElementById('livePreview'));
        setStatus(liveStatus, 'Starting…');
      } catch (err) {
        setStatus(liveStatus, String(err.message || err), 'err');
      }
    };

    document.getElementById('liveStopBtn').onclick = async () => {
      try {
        await post('/api/live/stop');
      } catch (err) {
        setStatus(liveStatus, String(err.message || err), 'err');
      }
    };

    async function deleteClip(eventId) {
      if (!confirm('Delete this clip file?')) return;
      const card = document.querySelector(`[data-del="${CSS.escape(eventId)}"]`)?.closest('.clip-card');
      try {
        await post('/api/clip/' + encodeURIComponent(eventId) + '/delete');
        if (card) {
          const group = card.closest('.gallery-class');
          card.remove();
          if (group && !group.querySelector('.clip-card')) group.remove();
          if (!document.querySelector('#gallery .clip-card')) {
            document.getElementById('gallery').innerHTML =
              '<p class="empty">No captures yet — run Live above.</p>';
          }
        }
        await refreshGallery();
      } catch (err) {
        alert(String(err.message || err));
        await refreshGallery();
      }
    }

    document.getElementById('deleteAllBtn').onclick = async () => {
      if (!confirm('Delete all saved detection clips on disk?')) return;
      try {
        const data = await post('/api/clips/delete_all');
        setStatus(liveStatus, 'Removed ' + (data.removed || 0) + ' clip file(s).', 'ok');
        refreshGallery();
      } catch (err) {
        setStatus(liveStatus, String(err.message || err), 'err');
      }
    };

    async function refreshGallery() {
      const res = await fetch('/api/events');
      const byClass = await res.json();
      const el = document.getElementById('gallery');
      el.innerHTML = '';
      const names = Object.keys(byClass).sort().filter((name) => {
        const rows = (byClass[name] || []).filter((r) => r.clip_url);
        byClass[name] = rows;
        return rows.length > 0;
      });
      if (!names.length) {
        el.innerHTML = '<p class="empty">No captures yet — run Live above.</p>';
        return;
      }
      for (const name of names) {
        const group = document.createElement('div');
        group.className = 'gallery-class';
        const rows = byClass[name];
        group.innerHTML = `<h3>${name} <span class="pill">${rows.length}</span></h3>`;
        const clips = document.createElement('div');
        clips.className = 'clips';
        for (const r of rows) {
          const card = document.createElement('div');
          card.className = 'clip-card';
          card.innerHTML =
            `<video controls preload="none" src="${r.clip_url}"></video>` +
            `<div class="clip-meta">${r.duration_sec != null ? r.duration_sec.toFixed(1) + 's' : ''}` +
            ` · score ${r.score !== null && r.score !== undefined ? r.score.toFixed(2) : '?'}` +
            `<br>${r.start_utc ? new Date(r.start_utc).toLocaleString() : r.source_id}</div>` +
            `<div class="clip-actions"><button type="button" class="ghost" data-del="${r.event_id}">Delete</button></div>`;
          clips.appendChild(card);
        }
        group.appendChild(clips);
        el.appendChild(group);
      }
      el.querySelectorAll('[data-del]').forEach((btn) => {
        btn.onclick = () => deleteClip(btn.getAttribute('data-del'));
      });
    }
    document.getElementById('refreshGalleryBtn').onclick = refreshGallery;
    refreshGallery();

    const es = new EventSource('/api/stream');
    es.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      switch (msg.kind) {
        case 'status':
          setStatus(recordStatus, msg.message);
          setStatus(liveStatus, msg.message);
          break;
        case 'record_started':
          setStatus(recordStatus, 'Recording “' + msg.class_name + '”…');
          break;
        case 'record_progress':
          setStatus(recordStatus, 'Recording… ' + msg.elapsed + 's');
          break;
        case 'record_error':
          setStatus(recordStatus, 'Camera error: ' + msg.message, 'err');
          document.getElementById('recordStartBtn').disabled = false;
          document.getElementById('recordStopBtn').disabled = true;
          document.getElementById('recordCancelBtn').disabled = true;
          hidePreview(document.getElementById('recordPreview'));
          break;
        case 'build_progress':
          setStatus(recordStatus, msg.message);
          break;
        case 'build_done':
          setStatus(recordStatus, 'Ready — ' + (msg.classes || []).join(', '), 'ok');
          document.getElementById('classNameInput').value = '';
          refreshState();
          break;
        case 'build_error':
          setStatus(recordStatus, 'Build failed: ' + msg.message, 'err');
          refreshState();
          break;
        case 'live_started':
          setStatus(liveStatus, 'Session ' + msg.session_id + ' — warming up (~' + msg.warmup_sec + 's)…');
          document.getElementById('liveFeed').innerHTML = '';
          feedLine('session started — waiting for background');
          break;
        case 'live_warmed_up':
          setStatus(liveStatus, 'Live — detection active (background ready).', 'ok');
          feedLine('background ready — detection live');
          break;
        case 'live_open':
          feedLine('open · σ ' + (msg.score != null ? Number(msg.score).toFixed(2) : '?'), {
            kind: 'open', className: msg.class_name || msg.class,
          });
          break;
        case 'live_close':
          feedLine(
            'closed · ' + (msg.duration_sec != null ? Number(msg.duration_sec).toFixed(1) + 's' : '') +
            ' · σ ' + (msg.score != null ? Number(msg.score).toFixed(2) : '?'),
            { kind: 'close', className: msg.class_name || msg.class }
          );
          refreshGallery();
          break;
        case 'live_error':
          setStatus(liveStatus, msg.message, 'err');
          document.getElementById('liveStartBtn').disabled = false;
          document.getElementById('liveStopBtn').disabled = true;
          hidePreview(document.getElementById('livePreview'));
          break;
        case 'live_stopped':
          setStatus(liveStatus, 'Stopped.', 'ok');
          document.getElementById('liveStartBtn').disabled = false;
          document.getElementById('liveStopBtn').disabled = true;
          hidePreview(document.getElementById('livePreview'));
          refreshState();
          refreshGallery();
          break;
      }
    };
  </script>
</body>
</html>
