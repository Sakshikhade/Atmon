[pytest]
# Pins rootdir to the repo root so conftest.py is always loaded. Without an ini
# file here, pytest infers rootdir from the arguments -- `pytest tests/` makes
# tests/ the rootdir, which puts the repo-root conftest.py outside confcutdir
# and the `import src...` bootstrap never runs. That is why the tests used to
# carry a sys.path.insert each.
testpaths = tests
